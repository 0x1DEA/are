name: CI-CD

on: push

jobs:
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 6.0.2

      - name: Build
        run: |
          pnpm install
          pnpm build

      - name: Tar build files
        run: tar -czvf assets.tar.gz public/build/

      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: assets
          path: assets.tar.gz

      - name: Upload SSR file
        uses: actions/upload-artifact@v7
        with:
          name: ssr
          path: bootstrap/ssr/ssr.mjs
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Download build assets
        uses: actions/download-artifact@v8
        with:
          name: assets
          path: public

      - name: Extract build files
        run: tar -xzvf public/assets.tar.gz

      - name: Download SSR file
        uses: actions/download-artifact@v8
        with:
          name: ssr
          path: boostrap/ssr

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.5
          extensions: mbstring, bcmath, dom, libxml, imagick, zlib
      - name: Composer install
        run: composer install
      - name: Setup Deployer
        uses: atymic/deployer-php-action@master
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Deploy to Staging
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          /usr/bin/php vendor/bin/dep launch stage=staging -vvv

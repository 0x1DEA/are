name: CI-CD

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - uses: pnpm/action-setup@v2
        with:
          version: 6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.5
          extensions: mbstring, bcmath, dom, libxml, imagick, zlib

      - name: Composer install
        run: composer install

      - name: Build
        run: |
          pnpm install
          pnpm build:ssr

      - name: Tar build files
        run: tar -czvf assets.tar.gz public/build/

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets.tar.gz

      - name: Tar SSR build files
        run: tar -czvf ssr.tar.gz bootstrap/ssr/

      - name: Upload SSR file
        uses: actions/upload-artifact@v4
        with:
          name: ssr
          path: ssr.tar.gz
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v1

      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: public

      - name: Extract build files
        run: tar -xzvf public/assets.tar.gz

      - name: Download SSR files
        uses: actions/download-artifact@v4
        with:
          name: ssr
          path: bootstrap

      - name: Extract build files
        run: tar -xzvf bootstrap/ssr.tar.gz

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.5
          extensions: mbstring, bcmath, dom, libxml, imagick, zlib

      - name: Composer install
        run: composer install

      - name: Setup Deployer
        uses: atymic/deployer-php-action@master
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy to Staging
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          /usr/bin/php vendor/bin/dep deploy env=staging -vvv
